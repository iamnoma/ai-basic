<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>니나니요의 도구함</title>

<!-- 폰 홈 화면에 추가했을 때 예쁘게 보이도록 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="니나니요의 도구함">
<meta name="theme-color" content="#f2f4f7">

<!-- Wanted Sans 글꼴 (설치 필요 없음, 인터넷에서 자동으로 받아옵니다) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wanted-sans@1.0.3/fonts/webfonts/static/split/WantedSans.css">

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: "Wanted Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: #222;
  }

  body {
    background: #f2f4f7;
    min-height: 100vh;
    /* 노치/홈바 있는 폰에서 화면 끝까지 배경이 채워지도록 */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 44px 20px 60px;
  }

  h1 {
    font-size: 26px;
    text-align: center;
    margin: 0 0 8px;
  }

  .sub {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin: 0 0 32px;
  }

  /* -------------------------------------------------
     도구 카드
     새 도구가 생기면 이 <a class="card">...</a> 덩어리를
     통째로 복사해서 아래에 붙여넣고 이름/설명/주소만 바꾸면 됩니다.
     ------------------------------------------------- */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    display: block;
    background: #fff;
    border-radius: 18px;
    padding: 22px 20px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 10px rgba(20, 20, 40, 0.06);
    border: 1px solid #eceef2;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .card:active {
    transform: scale(0.98);
    background: #fafafc;
  }

  .card-emoji {
    font-size: 30px;
    display: block;
    margin-bottom: 10px;
  }

  .card-title {
    font-size: 19px;
    font-weight: bold;
    margin: 0 0 4px;
  }

  .card-desc {
    font-size: 14px;
    color: #777;
    margin: 0;
    line-height: 1.4;
  }

  .card-arrow {
    float: right;
    color: #b03a63;
    font-size: 20px;
  }

  footer {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-top: 40px;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>🗂️ 니나니요의 도구함</h1>
  <p class="sub">눌러서 바로 열기</p>

  <div class="cards">

    <!-- 도구 1: 매일 체크리스트 -->
    <a class="card" href="tools/tool1.html">
      <span class="card-arrow">›</span>
      <span class="card-emoji">✅</span>
      <p class="card-title">매일 체크리스트</p>
      <p class="card-desc">매일 하는 일을 체크하고 한 달치를 한눈에 보기</p>
    </a>

    <!-- 도구 2: 내 사이트 목록 -->
    <a class="card" href="tools/tool2.html">
      <span class="card-arrow">›</span>
      <span class="card-emoji">🔗</span>
      <p class="card-title">내 사이트 목록</p>
      <p class="card-desc">자주 가는 사이트를 모아둔 목록</p>
    </a>

    <!-- 도구 3: 오늘의 유튜브 떡상 체크 -->
    <a class="card" href="tools/tool3.html">
      <span class="card-arrow">›</span>
      <span class="card-emoji">🔥</span>
      <p class="card-title">오늘의 유튜브 떡상 체크</p>
      <p class="card-desc">오늘 뜨는 유튜브 영상을 조회수·떡상지수로 확인하기</p>
    </a>

  </div>

  <footer>새 도구가 생기면 여기에 카드가 추가돼요</footer>
</div>

</body>
</html>
