<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 사이트 목록</title>
<!-- Wanted Sans 글꼴 (설치 필요 없음, 인터넷에서 자동으로 받아옵니다) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wanted-sans@1.0.3/fonts/webfonts/static/split/WantedSans.css">
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e6e6ea;
    --text: #18181b;
    --muted: #8a8a93;
    --accent: #3b6bf5;
    --accent-soft: #eef2ff;
    --danger: #e5484d;
    --danger-soft: #fdeceb;
  }
  * { box-sizing: border-box; }
  button, input { font-family: inherit; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: "Wanted Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    color: var(--text);
  }
  .icon { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 18px 60px;
  }

  /* 헤더 */
  .title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .title-row .icon { width: 26px; height: 26px; color: var(--accent); }
  .title-row h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.3px;
  }

  /* 검색창 */
  .search-box {
    position: relative;
    margin-bottom: 14px;
  }
  .search-box .icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }
  .search-box input {
    width: 100%;
    font-size: 17px;
    padding: 14px 16px 14px 46px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: var(--card);
    color: var(--text);
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-box input:focus { border-color: var(--accent); }

  /* 추가 폼 */
  .add-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin: 18px 0 24px;
  }
  .add-box h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .add-box h2 .icon { width: 16px; height: 16px; }
  .add-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .input-wrap { position: relative; }
  .input-wrap .icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .field input {
    width: 100%;
    font-size: 16px;
    padding: 10px 12px 10px 34px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--bg);
    color: var(--text);
  }
  .field input:focus { border-color: var(--accent); background: var(--card); }
  .add-full { grid-column: 1 / -1; }
  .add-btn {
    margin-top: 14px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .add-btn:active { background: #2c56d0; }

  /* 표 */
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  thead th {
    text-align: left;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
  }
  thead th:hover { color: var(--text); }
  .th-inner { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; }
  .sort-icon { width: 14px; height: 14px; opacity: 0.55; }
  .sort-icon.active { opacity: 1; color: var(--accent); }
  tbody td {
    padding: 13px 14px;
    border-top: 1px solid var(--border);
    font-size: 16px;
    vertical-align: middle;
  }
  tbody tr:hover { background: #fafbff; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .tag .icon { width: 12px; height: 12px; }
  td a.site-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--text);
    text-decoration: none;
    word-break: break-all;
  }
  td a.site-link .icon { width: 14px; height: 14px; color: var(--muted); }
  td a.site-link:hover { color: var(--accent); }
  td a.site-link:hover .icon { color: var(--accent); }
  .del-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
  }
  .del-btn .icon { width: 16px; height: 16px; }
  .del-btn:hover { background: var(--danger-soft); border-color: var(--danger-soft); color: var(--danger); }
  .empty-msg {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    padding: 44px 10px;
    color: var(--muted);
    font-size: 15px;
  }
  .empty-msg .icon { width: 30px; height: 30px; opacity: 0.5; }

  /* 휴대폰 화면: 표를 카드처럼 보여주기 */
  @media (max-width: 620px) {
    .add-grid { grid-template-columns: 1fr; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    table { border-radius: 14px; }
    tbody tr {
      border-top: 8px solid var(--bg);
      padding: 4px 0;
    }
    tbody tr:first-child { border-top: none; }
    tbody td {
      border-top: none;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    tbody td::before {
      content: attr(data-label);
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }
    td.num { text-align: left; }
    .del-cell { justify-content: flex-end; }
  }

  .home-link {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: 13px;
    font-weight: bold;
    color: var(--accent);
    text-decoration: none;
    margin-bottom: 14px;
  }
  .home-link:active { opacity: 0.6; }
</style>
</head>
<body>
<div class="wrap">
  <a class="home-link" href="../index.html">‹ 도구함</a>
  <div class="title-row">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
    <h1>내 사이트 목록</h1>
  </div>

  <div class="search-box">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="이름, 분류, 주소로 검색해 보세요…">
  </div>

  <div class="add-box">
    <h2>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      새 항목 추가
    </h2>
    <div class="add-grid">
      <div class="field">
        <label for="inName">이름</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg>
          <input type="text" id="inName" placeholder="예: 네이버">
        </div>
      </div>
      <div class="field">
        <label for="inCategory">분류</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.5 12.6 20.5a2 2 0 0 1-2.8 0l-6.3-6.3a2 2 0 0 1 0-2.8l8-8H18a3 3 0 0 1 3 3v6.6Z"/><circle cx="14.5" cy="8.5" r="1.2"/></svg>
          <input type="text" id="inCategory" placeholder="예: 포털">
        </div>
      </div>
      <div class="field add-full">
        <label for="inUrl">주소 (URL)</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5 14.5 9.5"/><path d="M11 6.5 12.4 5a3.5 3.5 0 0 1 5 5L16 11.5"/><path d="M13 17.5 11.6 19a3.5 3.5 0 0 1-5-5L8 12.5"/></svg>
          <input type="text" id="inUrl" placeholder="예: naver.com">
        </div>
      </div>
    </div>
    <button class="add-btn" id="addBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      추가하기
    </button>
  </div>

  <table>
    <thead>
      <tr>
        <th data-key="name" title="눌러서 정렬"><span class="th-inner">이름 <svg class="icon sort-icon" id="arrow-name" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg></span></th>
        <th data-key="category" title="눌러서 정렬"><span class="th-inner">분류 <svg class="icon sort-icon" id="arrow-category" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg></span></th>
        <th data-key="url" title="눌러서 정렬"><span class="th-inner">주소 <svg class="icon sort-icon" id="arrow-url" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg></span></th>
        <th data-key="count" title="눌러서 정렬"><span class="th-inner">사용 횟수 <svg class="icon sort-icon" id="arrow-count" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg></span></th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty-msg" id="emptyMsg" style="display:none;">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    검색 결과가 없어요
  </div>
</div>

<script>
  const STORAGE_KEY = 'mySiteList_v1';

  const defaultData = [
    { name: '네이버',      category: '포털',    url: 'https://www.naver.com',    count: 120 },
    { name: '구글',        category: '포털',    url: 'https://www.google.com',   count: 98  },
    { name: '유튜브',      category: '동영상',  url: 'https://www.youtube.com',  count: 210 },
    { name: '깃허브',      category: '개발',    url: 'https://github.com',       count: 15  },
    { name: '넷플릭스',    category: '동영상',  url: 'https://www.netflix.com',  count: 30  },
    { name: '쿠팡',        category: '쇼핑',    url: 'https://www.coupang.com',  count: 22  },
    { name: '인스타그램',  category: 'SNS',     url: 'https://www.instagram.com',count: 76  },
    { name: '카카오톡 PC버전', category: 'SNS',  url: 'https://www.kakaocorp.com',count: 40  }
  ];

  const ICON_LINK_ARROW = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';
  const ICON_TAG = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.5 12.6 20.5a2 2 0 0 1-2.8 0l-6.3-6.3a2 2 0 0 1 0-2.8l8-8H18a3 3 0 0 1 3 3v6.6Z"/><circle cx="14.5" cy="8.5" r="1.2"/></svg>';
  const ICON_TRASH = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6M14 11v6"/></svg>';
  const ICON_CHEVRON_UP = '<path d="M6 15l6-6 6 6"/>';
  const ICON_CHEVRON_DOWN = '<path d="M6 9l6 6 6-6"/>';
  const ICON_UP_DOWN = '<path d="M7 15l5 5 5-5M7 9l5-5 5 5"/>';

  let data = loadData();
  let sortKey = null;
  let sortDir = 1; // 1: 오름차순, -1: 내림차순

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
    return JSON.parse(JSON.stringify(defaultData));
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function normalizeUrl(url) {
    if (!url) return '';
    if (!/^https?:\/\//i.test(url)) return 'https://' + url;
    return url;
  }

  function displayUrl(url) {
    return String(url).replace(/^https?:\/\//i, '').replace(/\/$/, '');
  }

  function render() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    let rows = data.filter(item =>
      item.name.toLowerCase().includes(query) ||
      item.category.toLowerCase().includes(query) ||
      item.url.toLowerCase().includes(query)
    );

    if (sortKey) {
      rows.sort((a, b) => {
        let av = a[sortKey], bv = b[sortKey];
        if (sortKey === 'count') {
          return (av - bv) * sortDir;
        }
        return String(av).localeCompare(String(bv), 'ko') * sortDir;
      });
    }

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    document.getElementById('emptyMsg').style.display = rows.length ? 'none' : 'flex';

    rows.forEach(item => {
      const originalIndex = data.indexOf(item);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td data-label="이름">${escapeHtml(item.name)}</td>
        <td data-label="분류"><span class="tag">${ICON_TAG}${escapeHtml(item.category)}</span></td>
        <td data-label="주소"><a class="site-link" href="${normalizeUrl(item.url)}" target="_blank" rel="noopener">${escapeHtml(displayUrl(item.url))}${ICON_LINK_ARROW}</a></td>
        <td data-label="사용 횟수" class="num">${item.count}</td>
        <td class="del-cell"><button class="del-btn" data-index="${originalIndex}" aria-label="삭제">${ICON_TRASH}</button></td>
      `;
      tbody.appendChild(tr);
    });

    ['name', 'category', 'url', 'count'].forEach(key => {
      const el = document.getElementById('arrow-' + key);
      if (key === sortKey) {
        el.classList.add('active');
        el.innerHTML = sortDir === 1 ? ICON_CHEVRON_UP : ICON_CHEVRON_DOWN;
      } else {
        el.classList.remove('active');
        el.innerHTML = ICON_UP_DOWN;
      }
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  document.getElementById('searchInput').addEventListener('input', render);

  document.querySelectorAll('thead th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-key');
      if (sortKey === key) {
        sortDir *= -1;
      } else {
        sortKey = key;
        sortDir = 1;
      }
      render();
    });
  });

  document.getElementById('tableBody').addEventListener('click', (e) => {
    const btn = e.target.closest('.del-btn');
    if (btn) {
      const idx = Number(btn.getAttribute('data-index'));
      if (confirm('정말 삭제할까요?')) {
        data.splice(idx, 1);
        saveData();
        render();
      }
    }
  });

  document.getElementById('addBtn').addEventListener('click', () => {
    const name = document.getElementById('inName').value.trim();
    const category = document.getElementById('inCategory').value.trim();
    const url = document.getElementById('inUrl').value.trim();

    if (!name || !url) {
      alert('이름과 주소는 꼭 입력해 주세요.');
      return;
    }

    data.push({ name, category: category || '기타', url, count: 0 });
    saveData();

    document.getElementById('inName').value = '';
    document.getElementById('inCategory').value = '';
    document.getElementById('inUrl').value = '';
    document.getElementById('inName').focus();

    render();
  });

  render();
</script>
</body>
</html>
