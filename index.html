<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매일 체크리스트</title>

<!-- Wanted Sans 글꼴 (설치 필요 없음, 인터넷에서 자동으로 받아옵니다) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wanted-sans@1.0.3/fonts/webfonts/static/split/WantedSans.css">

<!-- 디자인(색깔, 크기, 배치)은 전부 style.css 에 있습니다 -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <h1>✅ 매일 체크리스트</h1>

  <div class="date-nav">
    <button class="nav-btn" id="prevDayBtn" title="이전 날">◀</button>
    <div class="date-center">
      <div class="today" id="todayLabel"></div>
      <div class="date-tag" id="dateTag"></div>
    </div>
    <button class="nav-btn" id="nextDayBtn" title="다음 날">▶</button>
  </div>
  <button class="back-today-btn" id="backTodayBtn">오늘로 돌아가기</button>

  <div class="add-box">
    <input type="text" id="newItemInput" placeholder="예: 약 먹기, 운동, 물 마시기">
    <button id="addBtn">추가</button>
  </div>

  <!-- 항목 카드들은 app.js 가 여기에 그려 넣습니다 -->
  <div id="itemList"></div>
  <div class="empty" id="emptyMsg" style="display:none;">아직 항목이 없어요. 위에서 추가해보세요!</div>
</div>

<!-- 동작(체크, 저장, 날짜 계산)은 전부 app.js 에 있습니다.
     화면을 다 만든 뒤에 실행되도록 맨 아래에 둡니다 -->
<script src="app.js"></script>
</body>
</html>
